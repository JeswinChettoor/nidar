services:
  nidar:
    build: .
    image: nidar-ros:humble
    container_name: nidar-dev

    stdin_open: true
    tty: true
    working_dir: /workspace

    # Grant full access to host hardware devices
    privileged: true

    # 1. Pass the host's display environment variable
    environment:
      - DISPLAY=${DISPLAY}

    volumes:
      - .:/workspace
      # Mount the entire host device tree into the container
      - /dev:/dev
      # 2. Mount the X11 display socket into the container
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # Useful for ROS 2 discovery on Linux
    network_mode: host

    command: bash
